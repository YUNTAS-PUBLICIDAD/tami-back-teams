name: Deploy Laravel Backend

on:
  push:
    branches: ["master", "pre-master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Validar build antes de desplegar
        run: |
          set -e
          if [ ! -s "vendor/autoload.php" ]; then
            echo "❌ vendor/autoload.php no existe o está vacío. Composer install falló."
            exit 1
          fi
          if [ ! -s "public/index.php" ]; then
            echo "❌ public/index.php no existe o está vacío."
            exit 1
          fi
          echo "✅ Build local válido"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/pre-master" ]]; then
            echo " environment=staging" >> $GITHUB_OUTPUT
            echo " dest_path=/home/${{ secrets.SERVER_USER }}/domains/staging.tamimaquinarias.com/public_html/back/" >> $GITHUB_OUTPUT
            echo " domain=staging.tamimaquinarias.com" >> $GITHUB_OUTPUT
          else
            echo " environment=production" >> $GITHUB_OUTPUT
            echo " dest_path=/home/${{ secrets.SERVER_USER }}/domains/tamimaquinarias.com/public_html/back/" >> $GITHUB_OUTPUT
            echo " domain=tamimaquinarias.com" >> $GITHUB_OUTPUT
          fi
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Test SSH Connection
        run: |
          for i in {1..3}; do
            if ssh -p ${{ secrets.SERVER_PORT }} \
                -o ConnectTimeout=30 \
                -o StrictHostKeyChecking=no \
                -i ~/.ssh/id_rsa \
                ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'echo "SSH OK"'; then
              echo "✅ Conexión SSH exitosa en intento $i"
              exit 0
            else
              echo "⚠️ Intento $i/3 falló, esperando 15s..."
              sleep 15
            fi
          done
          echo "❌ No se pudo establecer conexión SSH después de 3 intentos"
          exit 1
      - name: Deploy with Rsync
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            echo "🚀 Desplegando backend a: ${{ steps.env.outputs.dest_path }}"
            rsync -avz --delete \
              --timeout=300 \
              --exclude='.git/' \
              --exclude='.env' \
              --exclude='.env.backup' \
              --exclude='.env.production' \
              --exclude='node_modules/' \
              --exclude='storage/app/public/' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='bootstrap/cache/*.php' \
              --exclude='*.md' \
              --exclude='.github/' \
              --exclude='scratch/' \
              --exclude='.agents/' \
              -e "ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=3" \
              ./ \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ steps.env.outputs.dest_path }}
      - name: Post-deploy setup and verify
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            SSH_CMD="ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
            DEPLOY_PATH="/home/${{ secrets.SERVER_USER }}/domains/${{ steps.env.outputs.domain }}/public_html/back"
            echo "🔧 Configurando permisos y storage link..."
            $SSH_CMD "cd ${DEPLOY_PATH} && \
              mkdir -p storage/app/public storage/framework/{cache,sessions,views} storage/logs bootstrap/cache && \
              chmod -R 775 storage/ bootstrap/cache/ && \
              ln -sf ${DEPLOY_PATH}/storage/app/public ${DEPLOY_PATH}/public/storage && \
              echo '✅ Post-despliegue completado'"

            echo "🧹 Limpiando caché de Laravel..."
            $SSH_CMD "cd ${DEPLOY_PATH} && \
              php artisan config:clear && php artisan route:clear && php artisan cache:clear"

            echo "🔍 Verificando archivos..."
            $SSH_CMD "cd ${DEPLOY_PATH} && \
              for f in public/index.php vendor/autoload.php bootstrap/app.php; do
                SIZE=\$(stat -c%s \"\$f\" 2>/dev/null || echo 0)
                if [ \"\$SIZE\" -lt 50 ]; then
                  echo \"❌ \$f está vacío o no existe (\$SIZE bytes)\"
                  exit 1
                fi
              done && \
              echo '✅ Archivos Laravel verificados con contenido real'"
      - name: Notify completion
        run: echo "🚀 Deploy backend completado - ${{ steps.env.outputs.environment }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy falló. Revisa los logs para más detalles."
          echo "Posibles causas: timeout SSH, problemas de red, o límites del hosting."